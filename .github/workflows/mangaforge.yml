name: MangaForge Studio

on:
  schedule:
    - cron: "0 4 * * *"          # one episode + one trailer per day (04:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, skip YouTube upload (files come back as an artifact)"
        default: "false"

permissions:
  contents: write

concurrency: mangaforge

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System deps (ffmpeg + Arabic fonts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Python deps (CPU-only torch keeps the install small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache depth model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-depth-anything-v2-small

      - name: Self-test (fails fast if the render engine is broken)
        run: WORKERS=2 python -m mangaforge.main --selftest

      - name: Produce episode + trailer
        run: python -m mangaforge.main
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_TZ: Asia/Riyadh
          PEAK_SLOTS: "19:00,21:30"

      - name: Save series state (continuity between episodes)
        run: |
          git config user.name "mangaforge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/series.json || true
          git diff --cached --quiet || (git commit -m "state: episode done" && git push)

      - name: Keep dry-run files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/*
          if-no-files-found: ignore
